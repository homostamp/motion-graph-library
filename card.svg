    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131522" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0B0C10" stop-opacity="0.9" />
