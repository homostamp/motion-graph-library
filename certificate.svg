<svg width="150" height="200" viewBox="0 0 150 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="premCertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="35%" stop-color="#3a86ff" />
      <stop offset="70%" stop-color="#8338ec" />
      <stop offset="100%" stop-color="#f72585" />
    </linearGradient>

    <linearGradient id="premBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181A26" />
      <stop offset="100%" stop-color="#0B0C10" />
    </linearGradient>

    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00f5d4" />
    </linearGradient>

    <filter id="premGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="6" y="6" width="138" height="188" rx="14" fill="url(#premBgGrad)" stroke="url(#premCertGrad)" stroke-width="3" filter="url(#premGlow)" />

  <rect x="13" y="13" width="124" height="174" rx="10" fill="none" stroke="#3a86ff" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6" />

