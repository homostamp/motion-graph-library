<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <defs>
    <!-- Kâğıt Gölgesi -->
    <filter id="shadow-audio" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Arka Kâğıt Gövdesi -->
  <path d="M 15,10 H 60 L 85,35 V 110 A 8,8 0 0,1 77,118 H 23 A 8,8 0 0,1 15,110 Z" fill="#ffffff" filter="url(#shadow-audio)"/>
  
  <!-- Sağ Üst Kıvrılan Köşe -->
  <path d="M 60,10 V 30 A 5,5 0 0,0 65,35 H 85 Z" fill="#e2e8f0"/>

  <!-- İç Kırmızı Kare -->
  <rect x="25" y="42" width="50" height="50" rx="6" fill="#ef4444"/>
  
  <!-- Müzik Notası (Çiftli / Sekizlik Nota) -->
  <g fill="#ffffff">
    <!-- Sol Nota Başı (Açılı Elips) -->
    <ellipse cx="40" cy="74" rx="4.5" ry="3.5" transform="rotate(-20 40 74)"/>
    
    <!-- Sağ Nota Başı (Açılı Elips) -->
    <ellipse cx="60" cy="69" rx="4.5" ry="3.5" transform="rotate(-20 60 69)"/>
    
    <!-- Sol ve Sağ Dikey Saplar -->
    <rect x="42.5" y="55" width="2.5" height="19" rx="1"/>
    <rect x="62.5" y="50" width="2.5" height="19" rx="1"/>
    
    <!-- Üst Bağlantı Çubuğu (Beam) -->
    <polygon points="42.5,55 65,50 65,55 42.5,60"/>
  </g>
</svg>
