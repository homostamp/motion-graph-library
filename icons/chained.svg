<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Neon Gradient (Mavi - Mor - Cyan) -->
    <linearGradient id="chainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#3a86ff" />
      <stop offset="100%" stop-color="#8338ec" />
    </linearGradient>

    <!-- Neon Glow Efekti -->
    <filter id="chainGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Arka Plan Şeffaf Daire / Kalkan -->
  <circle cx="60" cy="60" r="48" fill="#131522" stroke="url(#chainGrad)" stroke-width="2.5" filter="url(#chainGlow)" />
  <circle cx="60" cy="60" r="42" stroke="#00f5d4" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.5" />

  <!-- 2. Birbirine Kenetlenmiş Neon Zincir Baklaları -->
  <g filter="url(#chainGlow)" transform="translate(25, 33)">
    <!-- Sol Zincir Halkası -->
    <rect x="5" y="10" width="32" height="20" rx="10" fill="none" stroke="#00f5d4" stroke-width="3.5" transform="rotate(-25 21 20)" />
    
    <!-- Sağ Zincir Halkası (Kenetlenmiş) -->
    <rect x="33" y="10" width="32" height="20" rx="10" fill="none" stroke="#8338ec" stroke-width="3.5" transform="rotate(-25 49 20)" />
    
    <!-- Bağlantı Noktası Parlaması (Kilitlenme Noktası) -->
    <circle cx="35" cy="20" r="3" fill="#FFFFFF" />
  </g>

  <!-- 3. Alt Ortalanmış CHAINED Metni (Çerçevesiz & Tam Simetrik) -->
  <text x="60" y="88" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1.5" filter="url(#chainGlow)">
    CHAINED
  </text>
</svg>
