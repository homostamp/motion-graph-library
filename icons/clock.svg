  <path d="M 50 50 L 65 50" stroke="#00f5d4" stroke-width="3" stroke-linecap="round"/>
  <!-- Tarih Metni -->
  <text x="50" y="72" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="8" font-weight="600" text-anchor="middle">RFC3161</text>
