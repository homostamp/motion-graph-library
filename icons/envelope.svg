<svg width="200" height="140" viewBox="0 0 200 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="envGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd" />
      <stop offset="50%" stop-color="#4895ef" />
      <stop offset="100%" stop-color="#00f5d4" />
    </linearGradient>
    <linearGradient id="envBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131522" />
      <stop offset="100%" stop-color="#0B0C10" />
    </linearGradient>
    <filter id="envGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Zarf Gövdesi -->
  <rect x="5" y="5" width="190" height="130" rx="12" fill="url(#envBg)" stroke="url(#envGrad)" stroke-width="3" filter="url(#envGlow)"/>
  <!-- Kapak Çizgileri -->
  <path d="M 10 10 L 100 75 L 190 10" stroke="#4895ef" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M 10 130 L 75 70" stroke="#9d4edd" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M 190 130 L 125 70" stroke="#9d4edd" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
