<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <defs>
    <!-- Kâğıt Kıvrım Gölgesi -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Arka Kâğıt Gövdesi -->
  <path d="M 15,10 H 60 L 85,35 V 110 A 8,8 0 0,1 77,118 H 23 A 8,8 0 0,1 15,110 Z" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Sağ Üst Kıvrılan Köşe -->
  <path d="M 60,10 V 30 A 5,5 0 0,0 65,35 H 85 Z" fill="#e2e8f0"/>

  <!-- İç Resim Alanı (Yeşil Kare) -->
  <rect x="25" y="42" width="50" height="50" rx="6" fill="#10b981"/>
  
  <!-- Dağ & Güneş Motifi -->
  <circle cx="38" cy="55" r="4.5" fill="#ffffff"/>
  <path d="M 30,82 L 44,64 L 54,76 L 60,69 L 70,82 Z" fill="#ffffff"/>
</svg>
