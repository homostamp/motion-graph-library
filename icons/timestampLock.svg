<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Lock / Padlock Graphic -->
  <g filter="url(#glow)">
    <!-- Shackle / Handle -->
    <path d="M 135 170 V 110 A 65 65 0 0 1 265 110 V 170" 
          fill="none" 
          stroke="#00A3FF" 
          stroke-width="18" 
          stroke-linecap="round"/>

    <!-- Lock Body (Circular main body) -->
    <circle cx="200" cy="270" r="135" 
            fill="#0f1520" 
            stroke="#00e5a3" 
            stroke-width="18" />
  </g>

  <!-- Inner Clock Dashed Circle -->
  <circle cx="200" cy="260" r="75" 
          fill="none" 
          stroke="#2b7fff" 
          stroke-width="4" 
          stroke-dasharray="7 6" 
          filter="url(#soft-glow)" />

  <!-- Clock Hands (L-shape showing 3:00) -->
  <path d="M 200 190 V 260 H 250" 
        fill="none" 
        stroke="#00ff9d" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#soft-glow)" />

  <!-- Text RFC3161 -->
  <text x="200" y="375" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="28" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="1">RFC3161</text>
</svg>
