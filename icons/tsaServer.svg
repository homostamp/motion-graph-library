<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4895ef" />
      <stop offset="100%" stop-color="#00f5d4" />
    </linearGradient>
  </defs>
  <!-- Sunucu Kasası Kulesi -->
  <rect x="25" y="15" width="70" height="90" rx="8" fill="#131522" stroke="url(#serverGrad)" stroke-width="2.5"/>
  <!-- Raf Çizgileri -->
  <line x1="25" y1="45" x2="95" y2="45" stroke="#4895ef" stroke-width="1.5" opacity="0.6"/>
  <line x1="25" y1="75" x2="95" y2="75" stroke="#4895ef" stroke-width="1.5" opacity="0.6"/>
  <!-- Sunucu Işıkları (LEDs) -->
  <circle cx="40" cy="30" r="3" fill="#00f5d4"/>
  <circle cx="50" cy="30" r="3" fill="#4895ef"/>
  <circle cx="40" cy="60" r="3" fill="#00f5d4"/>
  <circle cx="50" cy="60" r="3" fill="#4895ef"/>
  <circle cx="40" cy="90" r="3" fill="#00f5d4"/>
  <circle cx="50" cy="90" r="3" fill="#a259ff"/>
  <!-- TSA Etiketi -->
  <text x="80" y="33" fill="#00f5d4" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">TSA</text>
</svg>
