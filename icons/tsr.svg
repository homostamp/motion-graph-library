<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Beyaz Kağıt Gövdesi -->
  <path d="M 15,10 H 60 L 85,35 V 110 A 8,8 0 0,1 77,118 H 23 A 8,8 0 0,1 15,110 Z" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Kıvrılan Köşe -->
  <path d="M 60,10 V 30 A 5,5 0 0,0 65,35 H 85 Z" fill="#e2e8f0"/>

  <!-- Tam Ortalanmış Mavi "TSR" Yazısı -->
  <text x="50" y="62" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="2">
    TSR
  </text>

  <!-- TSR Yazısının Altındaki Saat İkonu -->
  <g stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Saat Dairesi -->
    <circle cx="50" cy="85" r="12" />
    <!-- Akrep ve Yelkovan -->
    <path d="M 50 85 V 78 M 50 85 L 55 85" />
  </g>
</svg>
