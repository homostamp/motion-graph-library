<svg xmlns="http://www.w3.org/2000/svg" viewBox="75 60 250 280" width="100%" height="100%">
  <defs>
    <!-- Hexagon Gradient -->
    <linearGradient id="hexGrad_Asset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd" />
      <stop offset="40%" stop-color="#4895ef" />
      <stop offset="100%" stop-color="#4cc9f0" />
    </linearGradient>

    <!-- Circle Clock Gradient -->
    <linearGradient id="clockGrad_Asset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4895ef" />
      <stop offset="100%" stop-color="#4cc9f0" />
    </linearGradient>

    <!-- Cyan Elements Neon Glow Filter -->
    <filter id="cyanGlow_Asset" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Dot Glow Filter -->
    <filter id="dotGlow_Asset" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Main Group Wrapper (Transparent Background) -->
  <g id="homostamp-logo-asset" transform="translate(0,0)">
    
    <!-- 1. Inner Hexagon Framework -->
    <polygon points="
      200, 75
      308.25, 137.5
      308.25, 262.5
      200, 325
      91.75, 262.5
      91.75, 137.5" 
      fill="none" 
      stroke="url(#hexGrad_Asset)" 
      stroke-width="3" 
      stroke-linejoin="round" />

    <!-- 2. Hexagon Vertices / Nodes (Aligned Colors) -->
    <circle cx="200" cy="75" r="5.5" fill="#a259ff" filter="url(#dotGlow_Asset)" />
    <circle cx="308.25" cy="137.5" r="5" fill="#3a86ff" filter="url(#dotGlow_Asset)" />
    <circle cx="308.25" cy="262.5" r="5" fill="#3a86ff" filter="url(#dotGlow_Asset)" />
    <circle cx="200" cy="325" r="5.5" fill="#a259ff" filter="url(#dotGlow_Asset)" />
    <circle cx="91.75" cy="262.5" r="5" fill="#a259ff" filter="url(#dotGlow_Asset)" />
    <circle cx="91.75" cy="137.5" r="5" fill="#3a86ff" filter="url(#dotGlow_Asset)" />

    <!-- 3. Inner Clock Circle -->
    <circle cx="200" cy="200" r="75" fill="none" stroke="url(#clockGrad_Asset)" stroke-width="3" />

    <!-- Clock Ticks -->
    <line x1="200" y1="131" x2="200" y2="139" stroke="#4cc9f0" stroke-width="2.5" stroke-linecap="round" />
    <line x1="269" y1="200" x2="261" y2="200" stroke="#4cc9f0" stroke-width="2.5" stroke-linecap="round" />
    <line x1="200" y1="269" x2="200" y2="261" stroke="#4cc9f0" stroke-width="2.5" stroke-linecap="round" />
    <line x1="131" y1="200" x2="139" y2="200" stroke="#4cc9f0" stroke-width="2.5" stroke-linecap="round" />

    <!-- 4. Dotted Clock Hand / Timestamp Extension (Silindi) -->
    <!-- Bu bölüm, 3 yeşil noktayı oluşturan kesikli çizgiyi içeriyordu ve kaldırıldı. -->

  </g>
</svg>
