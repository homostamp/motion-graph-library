<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', serif;">
  <!-- Style Definitions -->
  <style>
    .title { font-size: 28px; font-weight: bold; text-anchor: middle; }
    .composer { font-size: 13px; text-anchor: end; }
    .footer { font-size: 11px; text-anchor: middle; }
    .measure-num { font-size: 12px; font-style: italic; }
    .finger-num { font-size: 12px; font-weight: bold; }
    .time-sig { font-size: 22px; font-weight: bold; text-anchor: middle; }
    .staff-line { stroke: #000000; stroke-width: 1.2; }
    .bar-line { stroke: #000000; stroke-width: 1.5; }
    .thick-bar { stroke: #000000; stroke-width: 3.5; }
    .stem { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .note-head { fill: #000000; }
    .dashed-line { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4,4; }
